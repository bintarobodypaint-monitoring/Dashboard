<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GARDA OTO | Tunas Toyota Bintaro</title><script src="../js/auth.js?v=20260929-garda"></script><script>if(!DMSAuth.requireLogin())document.documentElement.style.display='none';</script><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#18283b;font:15px Arial,sans-serif}header{background:#b71425;color:#fff;padding:18px max(18px,calc((100vw - 1200px)/2));display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:26px}header small{display:block;margin-top:5px}main{max-width:1200px;margin:24px auto;padding:0 16px}.panel{background:#fff;border:1px solid #dce3eb;border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 3px 12px #17344a0a}.toolbar{display:flex;flex-wrap:wrap;align-items:end;gap:12px}.toolbar label{flex:1;min-width:220px;font-weight:bold}.toolbar input{display:block;width:100%;margin-top:7px;padding:12px;border:1px solid #b9c9d7;border-radius:8px;font-size:16px}button{background:#fff;color:#18283b;border:1px solid #b9c9d7;border-radius:8px;padding:10px 14px;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}.counts{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.counts span{background:#eaf0f8;border-radius:8px;padding:10px 14px}.counts b{font-size:20px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:900px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid #e3e9ee}th{background:#eaf0f8;white-space:nowrap}.empty{text-align:center;padding:30px}.badge{background:#e7f4ec;color:#12683c;border-radius:20px;padding:5px 9px;font-weight:bold}.badge.delivery{background:#e7eafa;color:#324ba4}.pager{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:14px}#status{color:#526477}#status.error{color:#b71425}[hidden]{display:none!important}@media(max-width:600px){header{gap:12px;flex-direction:column;align-items:flex-start}.panel{padding:15px}}</style></head><body><header><div><h1>GARDA OTO</h1><small>Unit AAB dan TI • Tunas Toyota Bintaro</small></div><button id="logout">LOGOUT</button></header><main><section class="panel"><h2>Monitoring GARDA OTO</h2><p>Semua unit AAB dan TI, baik dalam proses maupun sudah delivery.</p><div class="toolbar"><label>CARI NO POLISI<input id="search" type="search" placeholder="Ketik nomor polisi" autocomplete="off"></label><button id="refresh">↻ REFRESH DATA</button></div><div class="counts"><span>Total <b id="total">0</b></span><span>Proses <b id="process">0</b></span><span>Delivery <b id="delivery">0</b></span></div><div id="status" role="status">Menyiapkan data...</div></section><section class="panel"><div class="table-wrap"><table><thead><tr><th>NO POLISI</th><th>NO PKB</th><th>TYPE</th><th>ASURANSI</th><th>PROGRESS</th><th>TGL PKB</th><th>JANJI SELESAI</th><th>TANGGAL SELESAI</th></tr></thead><tbody id="rows"><tr><td class="empty" colspan="8">Memuat unit...</td></tr></tbody></table></div><div class="pager"><button id="prev">←</button><span id="page">Halaman 1 / 1</span><button id="next">→</button></div></section></main><script>(function(){'use strict';if(!DMSAuth.isGarda())return;const API='https://script.google.com/macros/s/AKfycbw5a2s4WxsPFTHfbXMI0DrZBiECdFcheOEbbwkFBY-9eypxT8ybe8lPMW--ALfDpcJY/exec',LIMIT=100,$=id=>document.getElementById(id);let all=[],shown=[],page=1;function val(r,...names){for(const n of names){const k=Object.keys(r).find(x=>x.trim().toUpperCase()===n);if(k)return r[k]}return ''}function str(x){return x==null?'':String(x)}function esc(x){return str(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function date(x){if(!x)return '-';const s=str(x);return esc(/^\d{4}-\d\d-\d\d/.test(s)?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):s)}function delivered(r){return /^17\s*\.\s*DELIVERY\b/i.test(str(val(r,'PROGRESS')).trim())}function render(){const pages=Math.max(1,Math.ceil(shown.length/LIMIT));page=Math.min(page,pages);$('page').textContent='Halaman '+page+' / '+pages;$('prev').disabled=page===1;$('next').disabled=page===pages;const rows=shown.slice((page-1)*LIMIT,page*LIMIT);$('rows').innerHTML=rows.length?rows.map(r=>{const cells=[val(r,'NO POLISI'),val(r,'NO PKB'),val(r,'TYPE'),val(r,'ASURANSI'),val(r,'PROGRESS'),val(r,'TGL PKB','TGL CETAK PKB'),val(r,'JANJI SELESAI'),val(r,'TANGGAL SELESAI')];return '<tr>'+cells.map((x,i)=>'<td>'+(i===4?'<span class="badge '+(delivered(r)?'delivery':'')+'">'+esc(x||'-')+'</span>':i>=5?date(x):esc(x||'-'))+'</td>').join('')+'</tr>'}).join(''):'<tr><td class="empty" colspan="8">Tidak ada unit yang cocok.</td></tr>'}function filter(){const q=$('search').value.toUpperCase().replace(/[^A-Z0-9]/g,'');shown=all.filter(r=>str(val(r,'NO POLISI')).toUpperCase().replace(/[^A-Z0-9]/g,'').includes(q));page=1;const done=shown.filter(delivered).length;$('total').textContent=shown.length.toLocaleString('id-ID');$('delivery').textContent=done.toLocaleString('id-ID');$('process').textContent=(shown.length-done).toLocaleString('id-ID');render()}function jsonp(){return new Promise((resolve,reject)=>{const cb='GARDA_'+Date.now()+'_'+Math.random().toString(36).slice(2),script=document.createElement('script');let done=false;const cleanup=()=>{clearTimeout(timer);delete window[cb];script.remove()};const fail=e=>{if(done)return;done=true;cleanup();reject(e)};const timer=setTimeout(()=>fail(new Error('API timeout')),70000);window[cb]=x=>{if(done)return;done=true;cleanup();resolve(x)};script.onerror=()=>fail(new Error('API gagal dimuat'));const url=new URL(API);url.searchParams.set('action','unit');url.searchParams.set('callback',cb);url.searchParams.set('_',Date.now());script.src=url.toString();document.head.appendChild(script)})}async function load(){$('refresh').disabled=true;$('status').className='';$('status').textContent='Mengambil DATABASE UNIT...';try{const result=await jsonp();if(!result||result.success!==true||!Array.isArray(result.data))throw new Error(result&&result.error||'Format respons API tidak valid');all=result.data.filter(r=>/^(AAB|TI)$/i.test(str(val(r,'ASURANSI')).trim()));filter();$('status').textContent=all.length.toLocaleString('id-ID')+' unit AAB/TI dimuat dari DATABASE UNIT.'}catch(e){all=[];filter();$('status').className='error';$('status').textContent='Gagal memuat data: '+e.message}finally{$('refresh').disabled=false}}$('search').addEventListener('input',filter);$('refresh').onclick=load;$('prev').onclick=()=>{if(page>1){page--;render()}};$('next').onclick=()=>{if(page<Math.ceil(shown.length/LIMIT)){page++;render()}};$('logout').onclick=()=>{DMSAuth.logout();location.replace('../index.html')};load()})();</script></body></html>
