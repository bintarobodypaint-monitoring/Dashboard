<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DAILY REPORT — DIGITAL MONITORING SYSTEM</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/portal.css"><script src="../js/auth.js?v=3"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script></head><body data-module="daily-report"><script>if(!DMSAuth.requireLogin())document.documentElement.style.display="none";</script><div class="module-shell-bar"><a class="module-back" href="../index.html">← KEMBALI KE DASHBOARD</a><div class="module-name">DAILY REPORT</div><button class="module-logout" type="button" onclick="DMSAuth.logout();location.replace('../index.html?login=1')">LOGOUT</button></div><main class="content module-page"><section class="page active"><div class="box" style="padding:18px"><h2>DAILY DASHBOARD REPORT</h2><p>Generate report berdasarkan data JPCB + Unit Inap.</p><label style="font-weight:800">TANGGAL REPORT</label><input id="dailyReportDate" type="date" style="height:42px;padding:0 10px;margin:8px 0 12px"><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="primary-btn" onclick="runDailyReport()">GENERATE REPORT</button><button class="primary-btn" onclick="location.href='../index.html'">← DASHBOARD</button></div><div id="dailyStatus" style="margin-top:12px;color:#667"></div></div><div id="dailyReportHost" style="margin-top:12px"></div></section></main><script src="../js/config.js"></script><script src="../js/common-audio.js"></script><script src="../js/jpcb-core.js"></script><script>function runDailyReport(){const d=document.getElementById('dailyReportDate').value||new Date().toISOString().slice(0,10);const s=document.getElementById('dailyStatus');s.textContent='Mengambil data dan menyiapkan report...';if(typeof downloadDailyReportImage==='function'){downloadDailyReportImage(d).then(()=>s.textContent='Report selesai diproses. Cek hasil download.').catch(e=>s.textContent='Gagal: '+e.message)}else{s.textContent='Engine Daily Report tidak termuat.'}}window.addEventListener('load',()=>{document.getElementById('dailyReportDate').value=new Date().toISOString().slice(0,10)});</script></body></html>
