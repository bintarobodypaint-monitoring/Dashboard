<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PERFORMANCE — DIGITAL MONITORING SYSTEM</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/portal.css"><script src="../js/auth.js?v=3"></script></head><body data-module="performance"><script>if(!DMSAuth.requireLogin())document.documentElement.style.display="none";</script><div class="module-shell-bar"><a class="module-back" href="../index.html">← KEMBALI KE DASHBOARD</a><div class="module-name">PERFORMANCE</div><button class="module-logout" type="button" onclick="DMSAuth.logout();location.replace('../index.html?login=1')">LOGOUT</button></div><main class="content module-page"><section class="page active"><div class="box" style="padding:18px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><div><h2>PERFORMANCE</h2><div id="perfStatus">Menghubungkan...</div></div><div><select id="perfMonth"></select><select id="perfYear"></select><button class="primary-btn" onclick="loadPerformance()">REFRESH</button></div></div></div><div class="cards" style="margin-top:10px"><div class="box"><h3>TOTAL UNIT ENTRY</h3><div id="perfTotal" style="font-size:32px;font-weight:900">0</div></div><div class="box"><h3>ATU 1</h3><div id="perfA1" style="font-size:32px;font-weight:900">0</div></div><div class="box"><h3>ATU 2</h3><div id="perfA2" style="font-size:32px;font-weight:900">0</div></div></div><div class="box" style="margin-top:10px;overflow:auto"><table><thead><tr><th>GROUP</th><th>UNIT ENTRY</th><th>TARGET UE</th><th>ACHIEVEMENT UE</th><th>REVENUE</th></tr></thead><tbody id="perfBody"><tr><td colspan="5">Menunggu data...</td></tr></tbody></table></div><div class="box" style="margin-top:10px;overflow:auto"><table><thead><tr><th>SA</th><th>UNIT ENTRY</th><th>TARGET UE</th><th>ACHIEVEMENT UE</th></tr></thead><tbody id="perfSABody"><tr><td colspan="4">Menunggu data...</td></tr></tbody></table></div></section></main><script src="../js/config.js"></script><script>const PERF_API=API.JPCB;const m=document.getElementById('perfMonth'),y=document.getElementById('perfYear');for(let i=1;i<=12;i++)m.innerHTML+=`<option value="${i}">${i}</option>`;for(let i=new Date().getFullYear()-1;i<=new Date().getFullYear()+1;i++)y.innerHTML+=`<option>${i}</option>`;m.value=new Date().getMonth()+1;y.value=new Date().getFullYear();function n(v){return Number(v)||0}async function loadPerformance(){const s=document.getElementById('perfStatus');s.textContent='Mengambil data...';try{const u=PERF_API+'?action=performance&month='+m.value+'&year='+y.value+'&ts='+Date.now();const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(!j.success)throw Error(j.error||'Response tidak valid');document.getElementById('perfTotal').textContent=n(j.total&&j.total.ue);const g=j.groups||[];const a1=g.find(x=>String(x.group).toUpperCase()==='ATU 1'),a2=g.find(x=>String(x.group).toUpperCase()==='ATU 2');document.getElementById('perfA1').textContent=n(a1&&a1.ue);document.getElementById('perfA2').textContent=n(a2&&a2.ue);document.getElementById('perfBody').innerHTML=g.map(x=>`<tr><td>${x.group||'-'}</td><td>${n(x.ue)}</td><td>${n(x.targetUE)}</td><td>${n(x.achievementUE)}%</td><td>${n(x.revenue)}</td></tr>`).join('')||'<tr><td colspan="5">Tidak ada data</td></tr>';document.getElementById('perfSABody').innerHTML=(j.data||[]).map(x=>`<tr><td>${x.sa||'-'}</td><td>${n(x.ue)}</td><td>${n(x.targetUE)}</td><td>${n(x.achievementUE)}%</td></tr>`).join('')||'<tr><td colspan="4">Tidak ada data</td></tr>';s.textContent='Terhubung • '+new Date().toLocaleTimeString('id-ID')}catch(e){s.textContent='Gagal terhubung ke Dashboard API';console.error(e)}}window.addEventListener('load',loadPerformance);</script></body></html>
