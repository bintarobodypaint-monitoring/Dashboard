let boardDate=new Date(2026,8,15); boardDate.setHours(0,0,0,0);

const ACT=[['PANEL REPAIR','STR PANEL REPAIR','STP PANEL REPAIR'],['PUTTY','STR PUTTY','STP PUTTY'],['SURFACER','STR SURFACER','STP SURFACER'],['PAINTING','STR PAINTING','STP PAINTING'],['POLISHING','STR POLISH','STP POLISH'],['RE-ASSEMBLY','STR ASSEMBLY','STP ASSEMBLY'],['FINAL INSPECTION','STR FINAL CHECK','STP FINAL CHECK']];
function dayKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dateOnly(x){if(!x)return null;let d=new Date(x);if(isNaN(d))return null;d.setHours(0,0,0,0);return d}

function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function dt(x){if(!x)return '-';let d=new Date(x);return isNaN(d)?x:d.toLocaleString('id-ID',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}

function parseDate(v){
 if(v==null||v==='')return null;
 if(v instanceof Date&&!isNaN(v))return new Date(v.getTime());
 const s=String(v).trim();
 if(!s)return null;
 let m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
 if(m){const d=new Date(Number(m[3]),Number(m[2])-1,Number(m[1]),Number(m[4]||0),Number(m[5]||0),Number(m[6]||0));return isNaN(d)?null:d;}
 let d=new Date(s);return isNaN(d)?null:d;
}
function workAdd(start,h){let d=new Date(start);let remain=Number(h)||0;while(remain>0){if(d.getDay()===0){d.setDate(d.getDate()+1);d.setHours(8,0,0,0);continue}if(d.getHours()<8)d.setHours(8,0,0,0);if(d.getHours()>=16.5){d.setDate(d.getDate()+1);d.setHours(8,0,0,0);continue}if(d.getHours()>=12&&d.getHours()<13){d.setHours(13,0,0,0);continue}let end=new Date(d);let available=d.getHours()<12?12-d.getHours():16.5-d.getHours();let take=Math.min(remain,available);end.setTime(d.getTime()+take*3600000);remain-=take;d=end;if(remain>0){if(d.getHours()===12)d.setHours(13,0,0,0);else if(d.getHours()>=16.5){d.setDate(d.getDate()+1);d.setHours(8,0,0,0)}}}return d}
function startWork(v){let d=parseDate(v)||new Date();if(d.getDay()===0){d.setDate(d.getDate()+1);d.setHours(8,0,0,0)}else if(d.getHours()<8)d.setHours(8,0,0,0);else if(d.getHours()>=16.5){d.setDate(d.getDate()+1);d.setHours(8,0,0,0)}else if(d.getHours()>=12&&d.getHours()<13)d.setHours(13,0,0,0);return d}
function progressCode(u){
 const p=normProgress(u.progress);
 const m=p.match(/^(?:0?)(\d{1,2})\s*[\.\-]?/);
 return m?Number(m[1]):null;
}
function processFromProgressCode(code){
 const map={1:'PANEL REPAIR',2:'PANEL REPAIR',3:'PUTTY',4:'PUTTY',5:'SURFACER',6:'SURFACER',7:'PAINTING',8:'PAINTING',9:'POLISHING',10:'POLISHING',11:'RE-ASSEMBLY',12:'RE-ASSEMBLY',13:'WASHING',14:'FINAL INSPECTION',15:'',16:''};
 return map[code]||'';
}
function nextProcess(proc){
 const i=PROC.findIndex(p=>p[0]===proc); return i>=0&&i<PROC.length-1?PROC[i+1][0]:'';
}
function processForUnit(u){
 // PROGRESS is the authoritative position. Queue/hold states never enter the plan.
 const code=progressCode(u), fromProgress=processFromProgressCode(code);
 if([0,1,16,17,18,19].includes(code)) return '';
 const actualIdx=[];
 ACT.forEach((a,i)=>{const st=u.leadtime?.[a[1]],sp=u.leadtime?.[a[2]];if(st)actualIdx.push({i,st,sp});});
 if(fromProgress){
   const waiting=(code===1||code===3||code===5||code===7||code===9||code===11||code===14||code===16);
   if(waiting) return fromProgress;
   // Active process: if STP exists, that process is complete and the plan starts next.
   const a=ACT.find(x=>x[0]===fromProgress);
   if(a && u.leadtime?.[a[2]]) return nextProcess(fromProgress)||fromProgress;
   // If no stop timestamp, do not schedule the active process again.
   // Start planning at the next process, using estimated completion of the current one.
   return nextProcess(fromProgress)||fromProgress;
 }
 // Fallback only when PROGRESS is unavailable: use the latest completed ACTUAL.
 let last=-1;
 actualIdx.forEach(x=>{if(x.sp)last=Math.max(last,x.i)});
 return last>=0 ? (PROC[last+1]?.[0]||PROC[last][0]) : 'PANEL REPAIR';
}
function processStartForUnit(u,cur){
 const code=progressCode(u), fromProgress=processFromProgressCode(code);
 const curIdx=PROC.findIndex(p=>p[0]===cur);
 // Waiting stage: start from its corresponding STR timestamp if available,
 // otherwise from STR PANEL REPAIR for the controller to plan.
 const waiting=[1,3,5,7,9,11,14,16].includes(code);
 if(waiting){
   const a=ACT.find(x=>x[0]===cur);
   return startWork(a?u.leadtime?.[a[1]]:u.leadtime?.['STR PANEL REPAIR']);
 }
 // Active stage already in progress: use its STP as the release point when present.
 if(fromProgress){
   const a=ACT.find(x=>x[0]===fromProgress);
   if(a){

 const standard=Number(DUR[modeOf(x)]?.[proc]||0),actualHours=(en-st)/3600000;if(actualHours+0.001<standard){alert('Durasi terlalu pendek. Kebutuhan proses '+standard+' jam, input hanya '+actualHours.toFixed(1)+' jam.');return}
 const dl=parseDate(x.janjiSelesai);if(proc==='FINAL INSPECTION'&&dl&&en>dl){alert('Plan FINAL INSPECTION melewati JANJI SELESAI. Controller tidak boleh menyimpan plan yang melanggar target.');return}
 const k=decisionKey(x)+'|'+proc, old=processDecisions[k]; processDecisions[k]={status:changed?'CHANGED':'APPROVED',start:st.toISOString(),end:en.toISOString(),at:new Date().toISOString()}; rerunPlans(); const nx=DATA.plan.find(z=>decisionKey(z)===decisionKey(x)), nd=parseDate(nx?.janjiSelesai), nf=parseDate(nx?.planFinish); if(nd&&nf&&nf>nd){if(old)processDecisions[k]=old;else delete processDecisions[k];rerunPlans();alert('Plan ditolak: perubahan ini membuat FINAL INSPECTION melewati JANJI SELESAI. Silakan pilih slot lebih awal atau ubah urutan proses.');return;} saveDecisions();closeM();selectedProcess=proc;renderProcessControl();document.getElementById('status').textContent=(changed?'Controller UBAH PLAN: ':'Controller APPROVE: ')+x.nopol+' / '+proc+' | tersimpan di browser';
}
// ===== CONTROLLER STALL SNAPSHOT FOR TOMORROW =====
// 15/09/2026: posisi fisik unit di stall menjadi PLAN + ACTUAL pada proses tersebut.
// Setelah proses aktual hari ini, target proses berikutnya tetap dihitung otomatis oleh sistem.
const TOMORROW_STALL_DATE='2026-09-15';
// Prioritas planning untuk hari berikutnya (16/09/2026), sesuai urutan controller.
const NEXT_DAY_PRIORITY_DATE='2026-09-16';
const NEXT_DAY_PRIORITY=['B 1372 DZJ','B 1953 SYV','B 1640 JKT','B 2536 WFI','B 1621 DQ','B 1460 HKB','B 1439 DFG','B 1731 DOG','B 1448 DOE','B 1493 DOG','B 1724 DOD'];
const NEXT_DAY_PRIORITY_MAP=new Map(NEXT_DAY_PRIORITY.map((n,i)=>[String(n).trim().toUpperCase(),i+1]));
function nextDayPriority(u){return NEXT_DAY_PRIORITY_MAP.get(String(u.nopol||'').trim().toUpperCase())||9999}
const TOMORROW_STALL_UNITS={
 'B 1372 DZJ':{stall:8,process:'PAINTING',label:'T.CAT',current:'WAITING PAINTING',next:'PAINTING'},
 'B 1953 SYV':{stall:8,process:'PAINTING',label:'T.CAT',current:'WAITING PAINTING',next:'PAINTING'},
 'B 1640 JKT':{stall:8,process:'PAINTING',label:'T.CAT',current:'WAITING PAINTING',next:'PAINTING'},
 'B 2536 WFI':{stall:1,process:'PANEL REPAIR',label:'KETOK',current:'PANEL REPAIR',next:'PUTTY'},
 'B 1621 DQ':{stall:2,process:'PANEL REPAIR',label:'KETOK',current:'PANEL REPAIR',next:'PUTTY'},
 'B 1460 HKB':{stall:3,process:'PANEL REPAIR',label:'KETOK',current:'PANEL REPAIR',next:'PUTTY'},
 'B 1439 DFG':{stall:4,process:'PANEL REPAIR',label:'KETOK',current:'PANEL REPAIR',next:'PUTTY'},
 'B 1731 DOG':{stall:4,process:'PUTTY',label:'DEMPUL',current:'PUTTY',next:'SURFACER'},
 'B 1448 DOE':{stall:5,process:'PUTTY',label:'DEMPUL',current:'PUTTY',next:'SURFACER'},
 'B 1493 DOG':{stall:6,process:'PUTTY',label:'DEMPUL',current:'PUTTY',next:'SURFACER'},
 'B 1724 DOD':{stall:7,process:'PUTTY',label:'DEMPUL',current:'PUTTY',next:'SURFACER'}
};
function tomorrowOverrideFor(u){const key=String(u.nopol||'').trim().toUpperCase();return TOMORROW_STALL_UNITS[key]||null}
function isTomorrowBoard(){return dayKey(boardDate)===TOMORROW_STALL_DATE}
function renderNowLine(){
 const el=document.getElementById('nowLine'), lab=document.getElementById('nowLineLabel');
 if(!el)return;
 const now=new Date();
 if(dayKey(boardDate)!==dayKey(now) || now.getHours()+now.getMinutes()/60<8 || now.getHours()+now.getMinutes()/60>16.5){el.style.display='none';return;}
 const h=now.getHours()+now.getMinutes()/60;
 const pct=Math.max(0,Math.min(100,((h-8)/9)*100));
 el.style.left=pct+'%';el.style.display='block';
 lab.textContent='NOW '+now.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
}
function snapshotActualStart(u,proc,planJob){
 const a=ACT.find(z=>z[0]===proc);
 let st=a?parseDate(u.leadtime?.[a[1]]):null;
 if(!st && planJob) st=parseDate(planJob.start);
 return st;
}
function renderJpcb(){
 if(!DATA)return;
 document.getElementById('groupLabel').textContent=(filter==='ALL'?'ALL GROUP':filter);
 document.getElementById('today').textContent=boardDate.toLocaleDateString('id-ID',{day:'2-digit',month:'2-digit',year:'numeric'});
 document.getElementById('stallList').innerHTML=stalls.map((x,i)=>`<div class="stall"><div class="no">${i+1}</div><div class="sn">${x}</div></div>`).join('');
 let rows=Array.from({length:11},()=>[]);
 let ds=new Date(boardDate);ds.setHours(8,0,0,0);
 let de=new Date(boardDate);de.setHours(17,0,0,0);
 const overrides=isTomorrowBoard();
 const overriddenKeys=new Set();
 // The controller's physical stall snapshot is used only for PROCESS/STALL identity.
 // Timing remains real: PLAN uses the system plan duration; ACTUAL runs from its real STR timestamp to the current time.
 if(overrides){
   Object.entries(TOMORROW_STALL_UNITS).forEach(([nopol,ov])=>{
     const u=visible().find(x=>String(x.nopol||'').trim().toUpperCase()===nopol);
     if(!u)return;
     const key=decisionKey(u);
     overriddenKeys.add(key+'|'+ov.process);
     const pj=(u.jobs||[]).find(j=>j.process===ov.process);
     // PLAN: use the normal system-generated process plan, but place it on the physical stall supplied by controller.
     if(pj){
       let st=parseDate(pj.start),en=parseDate(pj.end);
       if(st&&en&&en>ds&&st<de){
         const vs=st<ds?ds:st,ve=en>de?de:en;
         const l=Math.max(0,Math.min(100,((vs.getHours()+vs.getMinutes()/60)-8)/9*100));
         const r=Math.max(0,Math.min(100,((ve.getHours()+ve.getMinutes()/60)-8)/9*100));
         rows[ov.stall-1].push(`<span class="lab lp">P</span><div class="bar plan" style="left:${l}%;width:${Math.max(2,r-l)}%" onclick="detail('${esc(u.nopkb)}')">${esc(u.nopol)} · ${esc(ov.process)}</div>`);
       }
     }
     // ACTUAL: show only the elapsed portion of the real active process. Never stretch it to 08:00–16:00.
     const ast=snapshotActualStart(u,ov.process,pj);
     if(ast){
       const now=new Date();
       const end=(dayKey(boardDate)===dayKey(now))?now:(parseDate(u.leadtime?.[ACT.find(z=>z[0]===ov.process)?.[2]])||now);
       if(ast<de&&end>ds&&end>ast){
         const vs=ast<ds?ds:ast,ve=end>de?de:end;
         const l=Math.max(0,Math.min(100,((vs.getHours()+vs.getMinutes()/60)-8)/9*100));
         const r=Math.max(0,Math.min(100,((ve.getHours()+ve.getMinutes()/60)-8)/9*100));
         if(r>l) rows[ov.stall-1].push(`<span class="lab la">A</span><div class="bar actual ${u.atRisk?'risk':''}" style="left:${l}%;width:${Math.max(2,r-l)}%;top:55%" onclick="detail('${esc(u.nopkb)}')">${esc(u.nopol)} · ${esc(ov.process)}</div>`);
       }
     }
   });
 }
 // Normal PLAN bars. Snapshot rows are skipped only for the same process/stall identity, not for the rest of the unit's plan.
 visible().forEach(u=>(u.jobs||[]).forEach(j=>{
   if(overrides&&overriddenKeys.has(decisionKey(u)+'|'+j.process))return;
   let st=parseDate(j.start),en=parseDate(j.end);if(!st||!en||en<=ds||st>=de)return;
   let vs=st<ds?ds:st,ve=en>de?de:en;
   let l=Math.max(0,Math.min(100,((vs.getHours()+vs.getMinutes()/60)-8)/9*100)),r=Math.max(0,Math.min(100,((ve.getHours()+ve.getMinutes()/60)-8)/9*100));
   let n=Number(j.stall);if(n>=1&&n<=11)rows[n-1].push(`<span class="lab lp">P</span><div class="bar plan" style="left:${l}%;width:${Math.max(2,r-l)}%" onclick="detail('${esc(u.nopkb)}')">${esc(u.nopol)}</div>`);
 }));
 // ACTUAL bars from real LEADTIME STR/STP. For active processes, end at NOW so the bar follows the current clock.
 visible().forEach(u=>{
   const a=ACT.find(z=>u.leadtime[z[1]]&&!u.leadtime[z[2]]);if(!a)return;
   if(overrides&&Array.from(overriddenKeys).some(k=>k.startsWith(decisionKey(u)+'|')&&k.endsWith('|'+a[0])))return;
   let st=parseDate(u.leadtime[a[1]]);if(!st)return;
   const now=new Date();let en=(dayKey(boardDate)===dayKey(now))?now:parseDate(u.leadtime[a[2]])||now;
   if(!en||st>=de||en<=ds||en<=st)return;
   const pj=(u.jobs||[]).find(j=>j.process===a[0]);if(!pj)return;
   let n=Number(pj.stall),vs=st<ds?ds:st,ve=en>de?de:en;if(n<1||n>11)return;
   let l=Math.max(0,((vs.getHours()+vs.getMinutes()/60)-8)/9*100),r=Math.min(100,((ve.getHours()+ve.getMinutes()/60)-8)/9*100);
   if(r>l)rows[n-1].push(`<span class="lab la">A</span><div class="bar actual ${u.atRisk?'risk':''}" style="left:${Math.max(0,l)}%;width:${Math.max(2,r-l)}%" onclick="detail('${esc(u.nopkb)}')">${esc(u.nopol)}</div>`);
 });
 document.getElementById('timelineRows').innerHTML=rows.map(x=>`<div class="tr">${x.join('')}</div>`).join('');
 renderNowLine();
 document.getElementById('queue').innerHTML=visible().slice(0,12).map(x=>`<tr class="${x.atRisk?'riskrow':''}"><td>${x.rank}</td><td><b>${esc(x.nopol)}</b></td><td>${overrides&&tomorrowOverrideFor(x)?esc(tomorrowOverrideFor(x).next):esc(x.currentProcess)}</td><td>${dt(x.janjiSelesai)}</td></tr>`).join('');
 const labels=['Body Repair','Putty','Surfacer','Masking','Spraying','Polishing','Re-Assy'],map={'Body Repair':'PANEL REPAIR','Putty':'PUTTY','Surfacer':'SURFACER','Masking':'PAINTING','Spraying':'PAINTING','Polishing':'POLISHING','Re-Assy':'RE-ASSEMBLY'};
 document.getElementById('waiting').innerHTML=labels.map(x=>{let q=visible().filter(u=>String(u.currentProcess).toUpperCase()===map[x]).slice(0,5);return `<tr><td>${x}</td>${[0,1,2,3,4].map(i=>`<td>${q[i]?`<b>${esc(q[i].nopol)}</b>`:''}</td>`).join('')}</tr>`}).join('');
 document.getElementById('stop').textContent=visible().filter(x=>normProgress(x.progress).includes('JOB STOPPED')).map(x=>x.nopol).join(', ')||'Tidak ada.';
 document.getElementById('note').innerHTML=overrides?`<b>15/09/2026:</b> PLAN mengikuti proses/stall aktual yang ditentukan untuk tanggal 15/09/2026. TARGET PROCESS menggunakan mapping sistem: WAITING PAINTING → PAINTING, PANEL REPAIR/KETOK → PUTTY, PUTTY/DEMPUL → SURFACER. ACTUAL mengikuti waktu proses yang berlangsung sampai jam sekarang. Garis merah menunjukkan waktu berjalan.`:`<b>HASIL HARI SEBELUMNYA:</b> Gunakan hasil ACTUAL kemarin untuk menentukan prioritas hari ini. <br><b>PLAN HARI INI:</b> rekomendasi sistem; controller tetap memutuskan.`;
}

function detail(pkb){let x=(DATA.plan||[]).find(z=>z.nopkb===pkb);if(!x)return;document.getElementById('mh').textContent=x.nopol+' — PLAN';document.getElementById('mb').innerHTML=`<p><b>No PKB:</b> ${esc(x.nopkb)}</p><p><b>Kerusakan:</b> ${esc(x.kerusakan)}</p><p><b>Janji selesai:</b> ${dt(x.janjiSelesai)}</p><p><b>PROGRESS DATABASE:</b> ${esc(x.progress)}</p><p><b>PLAN DIMULAI DARI:</b> ${esc(x.currentProcess)}</p><p><b>Plan Finish:</b> ${dt(x.planFinish)}</p><p><b>Slack:</b> <span class="${x.slackHours<0?'danger':''}">${hours(x.slackHours)}</span></p><h4>Rencana per proses</h4>${x.jobs.map(j=>{const d=processDecisions[decisionKey(x)+'|'+j.process];return `<div class="modalProcessRow"><div class="modalProcessHead"><b>${esc(j.process)}</b><span>${d?.status==='APPROVED'?'✓ APPROVED':d?.status==='CHANGED'?'✎ DIUBAH':'PENDING'}</span></div><p>${esc(j.stall)} — ${dt(j.start)} → ${dt(j.end)} — ${j.hours.toFixed(1)} jam</p><div class="modalProcessActions"><button class="approveMini" onclick="approveProcess('${esc(x.nopkb)}','${esc(j.process)}');closeM()">✓ APPROVE</button><button class="changeMini" onclick="editProcess('${esc(x.nopkb)}','${esc(j.process)}')">✎ ATUR START/FINISH</button></div></div>`}).join('')}<hr><b>${x.atRisk?'⚠ TIDAK FEASIBLE — JANJI SELESAI TERLEWAT':'✓ PLAN MASIH DALAM TARGET'}</b>`;document.getElementById('modal').style.display='flex'}
function closeM(){document.getElementById('modal').style.display='none'}
function tab(id,b){renderMonthPlan();}
function setFilter(f){
 filter=f;
 ['ALL','ATU 1','ATU 2'].forEach(g=>{const id=g==='ALL'?'groupAllBtn':g==='ATU 1'?'group1Btn':'group2Btn';const b=document.getElementById(id);if(b)b.classList.toggle('active',g===f)});
 renderAll();

/* ===== MONTHLY JSCB PLAN VIEW ===== */
let monthPlanDate=new Date();monthPlanDate.setDate(1);monthPlanDate.setHours(0,0,0,0);
function monthPlanPrev(){monthPlanDate.setMonth(monthPlanDate.getMonth()-1);renderMonthPlan()}
function monthPlanNext(){monthPlanDate.setMonth(monthPlanDate.getMonth()+1);renderMonthPlan()}
function monthPlanToday(){monthPlanDate=new Date();monthPlanDate.setDate(1);monthPlanDate.setHours(0,0,0,0);renderMonthPlan()}
function monthPlanClass(proc){return {'PANEL REPAIR':'planBody','PUTTY':'planPutty','SURFACER':'planSurf','PAINTING':'planPaint','POLISHING':'planPolish','RE-ASSEMBLY':'planReassy','WASHING':'planWash','FINISHING':'planFinish','FINAL INSPECTION':'planFinal'}[proc]||'planBody'}
function monthPlanTimePct(d){let h=d.getHours()+d.getMinutes()/60+d.getSeconds()/3600;return Math.max(0,Math.min(100,((h-8)/8.5)*100))}
function renderMonthPlan(){
 const root=document.getElementById('monthPlanScroll');
 if(!root)return;
 // Jangan pernah menghapus kalender hanya karena render dipanggil sebelum callback API selesai.
 // Data akan dirender ulang setelah callbackLoad memasang DATA.
 if(!DATA){
   if(!root.dataset.hasRendered) root.innerHTML='<div style="padding:25px;text-align:center;font-weight:800">Menunggu DATABASE...</div>';
   return;
 }
 const y=monthPlanDate.getFullYear(),m=monthPlanDate.getMonth(),days=new Date(y,m+1,0).getDate();
 document.getElementById('monthPlanLabel').textContent=monthPlanDate.toLocaleDateString('id-ID',{month:'long',year:'numeric'}).toUpperCase();
 const a=visible();
 const monthStartDate=new Date(y,m,1,0,0,0,0), monthEndDate=new Date(y,m+1,1,0,0,0,0);
 const jobs=[];
 a.forEach(u=>(u.jobs||[]).forEach(j=>{
   const st=parseDate(j.start),en=parseDate(j.end);
   if(st&&en&&en>monthStartDate&&st<monthEndDate)jobs.push({u,j,st,en});
 }));
 const risk=new Set(a.filter(x=>x.atRisk).map(decisionKey));
 const units=new Set(jobs.map(x=>decisionKey(x.u))).size;
 const approved=jobs.filter(x=>processDecisions[decisionKey(x.u)+'|'+x.j.process]?.status==='APPROVED').length;
 document.getElementById('monthPlanKpi').innerHTML=`<div class="k"><b>UNIT TERJADWAL</b><strong>${units}</strong></div><div class="k"><b>PLAN PROCESS</b><strong>${jobs.length}</strong></div><div class="k"><b>APPROVED NEXT PROCESS</b><strong>${approved}</strong></div><div class="k"><b>AT RISK</b><strong>${risk.size}</strong></div>`;
 document.getElementById('monthPlanMeta').innerHTML=`<b>${fmtMonth(monthPlanDate)}</b> — ${a.length} unit | Board: <b>${boardType}</b> | Group: ${filter==='ALL'?'ALL':esc(filter)} | Menampilkan <b>PLAN TERKINI dari JSCB — PLAN</b>. Scroll horizontal untuk melihat seluruh tanggal.`;
 const cols=[];
 for(let day=1;day<=days;day++){
   const d=new Date(y,m,day),dow=d.getDay(),isToday=dayKey(d)===dayKey(new Date());
   cols.push(`<div class="monthDay ${dow===0?'sun':''} ${isToday?'today':''}">${String(day).padStart(2,'0')}<small>${d.toLocaleDateString('id-ID',{weekday:'short'}).toUpperCase()}</small></div>`);
 }
 const unitRows=a.filter(u=>(u.jobs||[]).some(j=>{const st=parseDate(j.start),en=parseDate(j.end);return st&&en&&en>monthStartDate&&st<monthEndDate})).map(u=>{
   let cells='';
   for(let day=1;day<=days;day++){
     const ds=new Date(y,m,day,8,0,0),de=new Date(y,m,day,16,30,0);
     const cellJobs=(u.jobs||[]).filter(j=>{const st=parseDate(j.start),en=parseDate(j.end);return st&&en&&en>ds&&st<de});
     let bars=cellJobs.map(j=>{
       const st=parseDate(j.start),en=parseDate(j.end);
       if(!st||!en)return '';
       const vs=st>ds?st:ds,ve=en<de?en:de;
       const left=monthPlanTimePct(vs),right=monthPlanTimePct(ve);
       if(right<=left)return '';
       const status=processDecisions[decisionKey(u)+'|'+j.process]?.status;
       const cls=u.atRisk?'risk':monthPlanClass(j.process);
       const label=status==='APPROVED'?' ✓':status==='CHANGED'?' ✎':'';
       return `<div class="mbar ${cls}" style="left:${left}%;width:${Math.max(3,right-left)}%" title="${esc(u.nopol)} | ${esc(j.process)} | ${dt(j.start)} → ${dt(j.end)} | Janji ${dt(u.janjiSelesai)}" onclick="detail('${esc(u.nopkb)}')">${esc(u.nopol)} · ${esc(j.process)}${label}</div>`;
     }).join('');
     cells+=`<div class="monthCell ${new Date(y,m,day).getDay()===0?'breakShade':''}">${bars}</div>`;
   }
   return cells;
 }).join('');
 root.innerHTML=`<div class="monthGrid" style="--days:${days}">${cols.join('')}${unitRows}</div>`;
 root.dataset.hasRendered='1';
}




load();
setTimeout(()=>{if(DATA&&document.getElementById('MONTHPLAN')?.style.display==='block')renderMonthPlan()},1000);
setInterval(load,60000);
