function dayKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dateOnly(x){if(!x)return null;let d=new Date(x);if(isNaN(d))return null;d.setHours(0,0,0,0);return d}

function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function dt(x){if(!x)return '-';let d=new Date(x);return isNaN(d)?x:d.toLocaleString('id-ID',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
function hours(x){if(x==null||isNaN(x))return '-';let n=Math.round(x*10)/10;return (n>=0?'+':'')+n+'j'}
function modeOf(u){let s=String(u.kerusakan||u.KERUSAKAN||'').toUpperCase();if(s.includes('HEAVY'))return'HEAVY';if(s.includes('MEDIUM'))return'MEDIUM';if(s.includes('LIGHT'))return'LIGHT';return''}
function normProgress(v){return String(v||'').trim().toUpperCase().replace(/\s+/g,' ')}
function isDelivered(u){let p=normProgress(u.progress);return p==='DELIVERY'||p==='17.DELIVERY'||(p.includes('DELIVERY')&&!p.includes('WAITING'))}
function parseDate(v){

 if(v instanceof Date&&!isNaN(v))return new Date(v.getTime());
 const s=String(v).trim();
 if(!s)return null;
 let m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
 if(m){const d=new Date(Number(m[3]),Number(m[2])-1,Number(m[1]),Number(m[4]||0),Number(m[5]||0),Number(m[6]||0));return isNaN(d)?null:d;}

}
function workAdd(start,h){let d=new Date(start);let remain=Number(h)||0;while(remain>0){if(d.getDay()===0){d.setDate(d.getDate()+1);d.setHours(8,0,0,0);continue}if(d.getHours()<8)d.setHours(8,0,0,0);if(d.getHours()>=16.5){d.setDate(d.getDate()+1);d.setHours(8,0,0,0);continue}if(d.getHours()>=12&&d.getHours()<13){d.setHours(13,0,0,0);continue}let end=new Date(d);let available=d.getHours()<12?12-d.getHours():16.5-d.getHours();let take=Math.min(remain,available);end.setTime(d.getTime()+take*3600000);remain-=take;d=end;if(remain>0){if(d.getHours()===12)d.setHours(13,0,0,0);else if(d.getHours()>=16.5){d.setDate(d.getDate()+1);d.setHours(8,0,0,0)}}}return d}
function startWork(v){let d=parseDate(v)||new Date();if(d.getDay()===0){d.setDate(d.getDate()+1);d.setHours(8,0,0,0)}else if(d.getHours()<8)d.setHours(8,0,0,0);else if(d.getHours()>=16.5){d.setDate(d.getDate()+1);d.setHours(8,0,0,0)}else if(d.getHours()>=12&&d.getHours()<13)d.setHours(13,0,0,0);return d}
function progressCode(u){

 const m=p.match(/^(?:0?)(\d{1,2})\s*[\.\-]?/);
 return m?Number(m[1]):null;
}
function isPlanningExcludedProgress(u){

 // ESTIMASI, WAITING SPK, dan WAITING PANEL REPAIR belum boleh masuk PLAN JSCB.
 if(/^00\s*[.\-]?ESTIMASI/.test(p)) return true;
 if(/^01\s*[.\-]?WAITING\s+SPK/.test(p)) return true;
 if(/^1\s*[.\-]?WAITING\s+PANEL\s+REPAIR/.test(p)) return true;

}
function activeProcessFromUnit(u){

 const mapped=processFromProgressCode(code);
 if(mapped)return mapped;

 const raw=normProgress(u?.progress||'');
 if(raw.includes('PANEL REPAIR'))return 'PANEL REPAIR';
 if(raw.includes('PUTTY'))return 'PUTTY';
 if(raw.includes('SURFACER'))return 'SURFACER';
 if(raw.includes('PAINTING'))return 'PAINTING';
 if(raw.includes('POLISH'))return 'POLISHING';
 if(raw.includes('REASSEMBLY')||raw.includes('RE-ASSEMBLY'))return 'RE-ASSEMBLY';
 if(raw.includes('WASHING'))return 'WASHING';
 if(raw.includes('FINISHING'))return 'FINISHING';

}
function processFromProgressCode(code){

 return map[code]||'';
}
function nextProcess(proc){
 const i=PROC.findIndex(p=>p[0]===proc); return i>=0&&i<PROC.length-1?PROC[i+1][0]:'';
}
function processForUnit(u){
 // PROGRESS adalah posisi aktual. Jika proses aktif belum punya STP/selesai,
 // proses tersebut tetap menjadi titik awal PLAN. Jangan lompat ke proses berikutnya.
 const code=progressCode(u), fromProgress=processFromProgressCode(code);
 if([0,16,17,18,19,20].includes(code) || isPlanningExcludedProgress(u)) return '';

 ACT.forEach((a,i)=>{const st=u.leadtime?.[a[1]],sp=u.leadtime?.[a[2]];if(st)actualIdx.push({i,st,sp});});
 if(fromProgress){
   const a=ACT.find(x=>x[0]===fromProgress);
   // Bila STP sudah ada, proses tersebut selesai dan PLAN lanjut ke proses berikutnya.
   if(a && u.leadtime?.[a[2]]) return nextProcess(fromProgress)||fromProgress;
   // Bila belum ada STP, proses sekarang masih aktif/harus dikerjakan.
   return fromProgress;
 }
 // Fallback hanya bila PROGRESS tidak tersedia: gunakan proses setelah actual terakhir yang selesai.
 let last=-1;
 actualIdx.forEach(x=>{if(x.sp)last=Math.max(last,x.i)});
 return last>=0 ? (PROC[last+1]?.[0]||PROC[last][0]) : 'PANEL REPAIR';
}

function firstNonBlank(){

 }

}
function pkbKeGroupOf(u){

   u?.['TGL PKB GROUP'], u?.['TGL PKB']

}
function janjiSelesaiOf(u){

   u?.JANJI_SELESAI_DATE, u?.['TANGGAL JANJI SELESAI'],

function normalizeApiDates(u){

 if(pkb && !u.pkbKeGroup) u.pkbKeGroup=pkb;

}
function planAnchorOf(u){

function nominalProcessStartFromPkb(u,cur){
 const anchor=planAnchorOf(u);
 if(!anchor)return null;
 const idx=PROC.findIndex(p=>p[0]===cur);
 if(idx<=0)return anchor;
 let d=new Date(anchor);
 const mode=modeOf(u);
 for(let i=0;i<idx;i++){
   d=workAdd(d,Number(DUR[mode]?.[PROC[i][0]]||0));
 }
 return d;
}

function processStartForUnit(u,cur){
 // JSCB PLAN is anchored to PKB KE GROUP.
 // ACTUAL is deliberately NOT read from DATABASE LEADTIME here.
 const nominal=nominalProcessStartFromPkb(u,cur);
 if(nominal)return nominal;

function requiredRemaining(u,cur){
 const mode=modeOf(u), idx=Math.max(0,PROC.findIndex(p=>p[0]===cur));

function basePriority(rows){

   const cur=processForUnit(u), st=processStartForUnit(u,cur), rem=requiredRemaining(u,cur), pf=workAdd(st,rem), dl=parseDate(u.janjiSelesai);

   return Object.assign({},u,{_cur:cur,_baseStart:st,_remaining:rem,_baseFinish:pf,_baseSlack:slack,_nextDayPriority:nextDayPriority(u)});

   const sa=a._baseSlack==null?Infinity:a._baseSlack, sb=b._baseSlack==null?Infinity:b._baseSlack;
   if(sa!==sb)return sa-sb;

function orderForProcess(proc,units){

   const sa=a._baseSlack==null?Infinity:a._baseSlack, sb=b._baseSlack==null?Infinity:b._baseSlack;

   const da=parseDate(a.janjiSelesai), db=parseDate(b.janjiSelesai);

function buildFullPlanFromStart(u){

 // Durasi standar tetap dipakai; tidak boleh mengarang tanggal setelah deadline.
 for(const procRow of PROC){
   const proc=procRow[0], hrs=Number(DUR[mode]?.[proc]||0); if(!hrs)continue;

   out.push({process:proc,stall:procRow[1][0],start:cursor.toISOString(),end:end.toISOString(),hours:hrs,fullPlan:true});

 // Jika full plan standar memang melewati janji, tandai saja; jangan memundurkan anchor.

function approvalProcessForUnit(u){

function rebuildAllPlans(rows){
 const eligible=rows.filter(u=>{const c=progressCode(u);return !isDelivered(u)&&c!=null&&!([0,16,17,18,19,20].includes(c))&&modeOf(u)&&processForUnit(u);});

 const unitMap=new Map(prioritized.map(u=>[decisionKey(u),Object.assign({},u)]));

 const processNames=PROC.map(p=>p[0]);
 let upstreamEnd=new Map();
 prioritized.forEach(u=>{upstreamEnd.set(decisionKey(u),processStartForUnit(u,u._cur))});
 // Schedule process-by-process so each process queue can be controlled independently.
 for(const [pi,procRow] of PROC.entries()){
   const proc=procRow[0], candidates=orderForProcess(proc,prioritized).filter(u=>{

   });

   for(const u0 of candidates){
     const key=decisionKey(u0), u=unitMap.get(key), mode=modeOf(u), hrs=Number(DUR[mode]?.[proc]||0); if(!hrs)continue;
     let earliest=upstreamEnd.get(key)||new Date();
     const manual=processDecisions[key+'|'+proc];
     let chosen=null;
     if(manual?.start){
       const ms=startWork(manual.start); if(ms>earliest)earliest=ms;
     }
     if(manual?.start&&manual?.end){
       const ms=startWork(manual.start), me=parseDate(manual.end), due=parseDate(u.janjiSelesai);

       let best=null;
       for(const f of frees){
         const ss=f.free&&f.free>earliest?f.free:earliest;

   const key=decisionKey(u), nu=unitMap.get(key), jobs=jobsByUnit.get(key)||[];

   const pf=jobs.length?jobs[jobs.length-1].end:new Date(upstreamEnd.get(key)||u._baseFinish).toISOString();
   const deadline=parseDate(nu.janjiSelesai), slack=deadline?(deadline-new Date(pf))/3600000:null;
   const approvedProcesses=PROC.map(p=>p[0]).filter(p=>processDecisions[key+'|'+p]?.status==='APPROVED');
   const atRisk=slack!=null&&slack<0;
   const tight=slack!=null&&slack>=0&&slack<=4;
   const rec=atRisk?'🔴 TIDAK FEASIBLE — plan melewati JANJI SELESAI':tight?'🟠 TIGHT — slack ≤ 4 jam':'🟢 REKOMENDASI SISTEM';

function jsonpDirect(action, ok, fail, timeoutMs=20000){
 const cb='JSCB_API_'+String(action).replace(/[^A-Za-z0-9_$]/g,'_')+'_'+Date.now();
 let done=false;
 const script=document.createElement('script');
 script.async=true;
 script.id=cb;
 const cleanup=()=>{try{delete window[cb]}catch(e){};if(script.parentNode)script.parentNode.removeChild(script)};
 const good=(res)=>{if(done)return;done=true;clearTimeout(timer);cleanup();try{ok(res)}catch(e){console.error('API callback error',e);if(fail)fail('ERROR CALLBACK: '+(e.message||e))}};
 const bad=(msg)=>{if(done)return;done=true;clearTimeout(timer);cleanup();if(fail)fail(msg)};
 window[cb]=good;
 script.onerror=()=>bad('SCRIPT API GAGAL DIMUAT. Cek URL Web App / deployment / akses Anyone.');
 const base=String(API||'').replace(/\?$/,'');
 script.src=base+'?action='+encodeURIComponent(action)+'&callback='+encodeURIComponent(cb)+'&_='+Date.now();
 document.head.appendChild(script);
 const timer=setTimeout(()=>bad('TIMEOUT '+Math.round(timeoutMs/1000)+' DETIK — API tidak mengirim callback.'),timeoutMs);
}

   let n=Number(pj.stall),vs=st<ds?ds:st,ve=en>de?de:en;if(n<1||n>11)return;
   let l=Math.max(0,((vs.getHours()+vs.getMinutes()/60)-8)/9*100),r=Math.min(100,((ve.getHours()+ve.getMinutes()/60)-8)/9*100);
   if(r>l)rows[n-1].push(`<span class="lab la">A</span><div class="bar actual ${u.atRisk?'risk':''}" style="left:${Math.max(0,l)}%;width:${Math.max(2,r-l)}%">${esc(u.nopol)}</div>`);
 });
 document.getElementById('timelineRows').innerHTML=rows.map(x=>`<div class="tr">${x.join('')}</div>`).join('');
 renderNowLine();
 document.getElementById('queue').innerHTML=visible().slice(0,12).map(x=>`<tr class="${x.atRisk?'riskrow':''}"><td>${x.rank}</td><td><b>${esc(x.nopol)}</b></td><td>${overrides&&tomorrowOverrideFor(x)?esc(tomorrowOverrideFor(x).next):esc(x.currentProcess)}</td><td>${dt(x.janjiSelesai)}</td></tr>`).join('');
 const labels=['Body Repair','Putty','Surfacer','Masking','Spraying','Polishing','Re-Assy'],map={'Body Repair':'PANEL REPAIR','Putty':'PUTTY','Surfacer':'SURFACER','Masking':'PAINTING','Spraying':'PAINTING','Polishing':'POLISHING','Re-Assy':'RE-ASSEMBLY'};
 document.getElementById('waiting').innerHTML=labels.map(x=>{let q=visible().filter(u=>String(u.currentProcess).toUpperCase()===map[x]).slice(0,5);return `<tr><td>${x}</td>${[0,1,2,3,4].map(i=>`<td>${q[i]?`<b>${esc(q[i].nopol)}</b>`:''}</td>`).join('')}</tr>`}).join('');
 document.getElementById('stop').textContent=visible().filter(x=>normProgress(x.progress).includes('JOB STOPPED')).map(x=>x.nopol).join(', ')||'Tidak ada.';
 document.getElementById('note').innerHTML=overrides?`<b>15/09/2026:</b> PLAN mengikuti proses/stall aktual yang ditentukan untuk tanggal 15/09/2026. TARGET PROCESS menggunakan mapping sistem: WAITING PAINTING → PAINTING, PANEL REPAIR/KETOK → PUTTY, PUTTY/DEMPUL → SURFACER. ACTUAL mengikuti waktu proses yang berlangsung sampai jam sekarang. Garis merah menunjukkan waktu berjalan.`:`<b>HASIL HARI SEBELUMNYA:</b> Gunakan hasil ACTUAL kemarin untuk menentukan prioritas hari ini. <br><b>PLAN HARI INI:</b> rekomendasi sistem; controller tetap memutuskan.`;
}

function detail(pkb){let x=(DATA.plan||[]).find(z=>z.nopkb===pkb);if(!x)return;document.getElementById('mh').textContent=x.nopol+' — PLAN';document.getElementById('mb').innerHTML=`<p><b>No PKB:</b> ${esc(x.nopkb)}</p><p><b>Kerusakan:</b> ${esc(x.kerusakan)}</p><p><b>Janji selesai:</b> ${dt(x.janjiSelesai)}</p><p><b>PROGRESS DATABASE:</b> ${esc(x.progress)}</p><p><b>PLAN DIMULAI DARI:</b> ${esc(x.currentProcess)}</p><p><b>Plan Finish:</b> ${dt(x.planFinish)}</p><p><b>Slack:</b> <span class="${x.slackHours<0?'danger':''}">${hours(x.slackHours)}</span></p><h4>Rencana per proses</h4>${x.jobs.map(j=>{const d=processDecisions[decisionKey(x)+'|'+j.process];return `<div class="modalProcessRow"><div class="modalProcessHead"><b>${esc(j.process)}</b><span>${d?.status==='APPROVED'?'✓ APPROVED':d?.status==='CHANGED'?'✎ DIUBAH':'PENDING'}</span></div><p>${esc(j.stall)} — ${dt(j.start)} → ${dt(j.end)} — ${j.hours.toFixed(1)} jam</p><div class="modalProcessActions"><button class="approveMini" onclick="approveProcess('${esc(x.nopkb)}','${esc(j.process)}');closeM()">✓ APPROVE</button><button class="changeMini" onclick="editProcess('${esc(x.nopkb)}','${esc(j.process)}')">✎ ATUR START/FINISH</button></div></div>`}).join('')}<hr><b>${x.atRisk?'⚠ TIDAK FEASIBLE — JANJI SELESAI TERLEWAT':'✓ PLAN MASIH DALAM TARGET'}</b>`;document.getElementById('modal').style.display='flex'}
function closeM(){document.getElementById('modal').style.display='none'}
function setFilter(f){
 filter=f;
 ['ALL','ATU 1','ATU 2'].forEach(g=>{const id=g==='ALL'?'groupAllBtn':g==='ATU 1'?'group1Btn':'group2Btn';const b=document.getElementById(id);if(b)b.classList.toggle('active',g===f)});
 renderMonthPlan();
}

/* ===== MONTHLY JSCB PLAN VIEW ===== */
let monthPlanDate=new Date();monthPlanDate.setDate(1);monthPlanDate.setHours(0,0,0,0);
function monthPlanPrev(){monthPlanDate.setMonth(monthPlanDate.getMonth()-1);renderMonthPlan()}
function monthPlanNext(){monthPlanDate.setMonth(monthPlanDate.getMonth()+1);renderMonthPlan()}
function monthPlanToday(){monthPlanDate=new Date();monthPlanDate.setDate(1);monthPlanDate.setHours(0,0,0,0);renderMonthPlan()}
function monthPlanClass(proc){return {'PANEL REPAIR':'planBody','PUTTY':'planPutty','SURFACER':'planSurf','PAINTING':'planPaint','POLISHING':'planPolish','RE-ASSEMBLY':'planReassy','WASHING':'planWash','FINISHING':'planFinish','FINAL INSPECTION':'planFinal'}[proc]||'planBody'}
function monthPlanTimePct(d){let h=d.getHours()+d.getMinutes()/60+d.getSeconds()/3600;return Math.max(0,Math.min(100,((h-8)/8.5)*100))}

function closeJscbPopup(){
 const p=document.getElementById('jscbPopup'); if(p)p.classList.remove('open');
}
function openJscbPopup(plate){
 const u=(DATA?.plan||[]).find(x=>String(x.nopol||'').toUpperCase()===String(plate||'').toUpperCase());
 if(!u)return;
 const due=janjiSelesaiOf(u), pr=priorityInfo(u), actual=actualBarForUnit(u);
 const jobs=(u.jobs||[]).map(j=>`<div class="popLine"><b>${esc(j.process)}</b><span>${dt(j.start)} → ${dt(j.end)}</span></div>`).join('')||'<div class="popEmpty">Tidak ada PLAN.</div>';
 document.getElementById('jscbPopupBody').innerHTML=
 `<div class="popHead"><div><div class="popPlate">${esc(u.nopol||'-')}</div><div class="popSub">PKB ${esc(u.nopkb||'-')} · ${esc(u.group||'-')}</div></div><div class="popPriority ${pr.cls}">${esc(pr.label)}</div></div>`+
 `<div class="popInfo"><div><small>PKB KE GROUP (M)</small><b>${esc(pkbKeGroupOf(u)?dt(pkbKeGroupOf(u)):'DATA KOSONG')}</b></div><div><small>JANJI SELESAI (N)</small><b>${esc(due?dt(due):'DATA KOSONG')}</b></div><div><small>PROSES AKTUAL</small><b>${esc(activeProcessFromUnit(u)||'-')}</b></div><div><small>GROUP</small><b>${esc(unitGroup(u))}</b></div></div>`+
 `<div class="popTitle">ACTUAL</div><div class="popActual">${actual?`<b>${esc(actual.process)}</b><span>${actual.start?'Mulai '+dt(actual.start):'LOG UNIT belum tersedia'}</span>`:'Belum ada ACTUAL'}</div>`+
 `<div class="popTitle">PLAN PER PROSES</div>${jobs}`;
 const p=document.getElementById('jscbPopup'); if(p)p.classList.add('open');
}
function priorityInfo(u){
 const due=parseDate(janjiSelesaiOf(u)); if(!due)return{label:'JANJI -',days:null,cls:'pnone'};
 const t=new Date();t.setHours(0,0,0,0);const d=new Date(due);d.setHours(0,0,0,0);
 const days=Math.ceil((d-t)/86400000);
 if(days<0)return{label:`TERLAMBAT ${Math.abs(days)} HARI`,days,cls:'p1'};
 if(days<=1)return{label:`MEPET ${days} HARI`,days,cls:'p2'};
 if(days<=3)return{label:`${days} HARI`,days,cls:'p3'};
 return{label:`${days} HARI`,days,cls:'p4'};
}
function unitGroup(u){return String(u.group||u.GROUP||u['GROUP']||'').trim().toUpperCase()||'-';}
function actualBarForUnit(u){
 const proc=activeProcessFromUnit(u); const c=progressCode(u);
 if(!proc||[17,18,19,20].includes(c))return null;
 const raw=u.logUnit??u.LOG_UNIT??u['LOG UNIT']??u.log_unit??u.logs??u.LOGS??u.log??u.LOG??null;
 let latest=null;
 const take=v=>{
  if(!v)return;
  if(Array.isArray(v)){v.forEach(take);return}
  if(typeof v==='object'){
   const d=parseDate(v.timestamp??v.date??v.datetime??v.time??v['LOG UNIT']??v.LOG_UNIT);
   if(d&&(!latest||d>latest.date))latest={date:d};
  }else{
   const d=parseDate(v);if(d&&(!latest||d>latest.date))latest={date:d};
  }
 };
 take(raw);
 return {process:proc,start:latest?.date||null,end:new Date()};
}
function renderMonthPlan(){
 const root=document.getElementById('monthPlanScroll'); if(!root)return;
 if(!DATA){root.innerHTML='<div class="gLoading">MEMUAT DATABASE...</div>';return;}
 const y=monthPlanDate.getFullYear(),m=monthPlanDate.getMonth(),days=new Date(y,m+1,0).getDate(),today=new Date();
 const source=(DATA.raw||[]).filter(u=>{
   const c=progressCode(u);
   return c!=null&&!([0,16,17,18,19,20].includes(c))&&!isPlanningExcludedProgress(u)&&!isDelivered(u)&&
          (filter==='ALL'||unitGroup(u)===String(filter).toUpperCase());
 }).map(u=>{
   const planned=(DATA.plan||[]).find(x=>decisionKey(x)===decisionKey(u));
   return planned || Object.assign({},u,{jobs:[],fullJobs:[],currentProcess:activeProcessFromUnit(u),janjiSelesai:janjiSelesaiOf(u),pkbKeGroup:pkbKeGroupOf(u)});
 });
 const groups={'ATU 1':[],'ATU 2':[],'LAINNYA':[]};
 source.forEach(u=>(groups[unitGroup(u)]||groups.LAINNYA).push(u));
 Object.values(groups).forEach(a=>a.sort((x,z)=>{
   const px=priorityInfo(x),pz=priorityInfo(z),dx=px.days==null?99999:px.days,dz=pz.days==null?99999:pz.days;
   return dx-dz||String(x.nopol||'').localeCompare(String(z.nopol||''));
 }));
 const urgent=source.filter(u=>['p1','p2'].includes(priorityInfo(u).cls)).length;
 const late=source.filter(u=>priorityInfo(u).cls==='p1').length;
 document.getElementById('monthPlanLabel').textContent=monthPlanDate.toLocaleDateString('id-ID',{month:'long',year:'numeric'}).toUpperCase();
 document.getElementById('monthPlanKpi').innerHTML=
 `<div class="k"><b>WIP</b><strong>${source.length}</strong></div><div class="k"><b>ATU 1</b><strong>${groups['ATU 1'].length}</strong></div><div class="k"><b>ATU 2</b><strong>${groups['ATU 2'].length}</strong></div><div class="k"><b>PRIORITAS</b><strong>${urgent}</strong></div><div class="k"><b>TERLAMBAT</b><strong>${late}</strong></div>`;
 document.getElementById('monthPlanMeta').innerHTML='<span>PLAN START = PKB KE GROUP · TARGET FINISH = JANJI SELESAI · URUTAN OTOMATIS = DEADLINE TERDEKAT</span>';

 let html=`<div class="gBoard" style="--days:${days};--dayW:112px">`;
 html+=`<div class="gHead"><div class="gFixed">NO POLISI · PRIORITAS · GRUP · JANJI</div><div class="gLaneHead"> <span> </span></div><div class="gDates">`;
 for(let d=1;d<=days;d++){const date=new Date(y,m,d),it=dayKey(date)===dayKey(today);html+=`<div class="gDate ${it?'today':''}"><b>${String(d).padStart(2,'0')}</b><small>${date.toLocaleDateString('id-ID',{weekday:'short'}).toUpperCase()}</small></div>`;}
 html+=`</div></div>`;
 const renderCategory=(groupName,category,arr)=>{
   if(!arr.length)return;
   html+=`<div class="gGroup gCategory"><b>${groupName} — ${category}</b><span>${arr.length} UNIT</span></div>`;
   arr.forEach(u=>{
     const pr=priorityInfo(u),due=janjiSelesaiOf(u),actual=actualBarForUnit(u);
     html+=`<div class="gRow"><div class="gInfo" onclick="openJscbPopup('${esc(u.nopol||'')}')"><div class="gPlate">${esc(u.nopol||'-')}</div><div class="gMeta"><span class="pTag ${pr.cls}">${esc(pr.label)}</span><span>${esc(unitGroup(u))}</span><span>JANJI ${due?esc(dt(due)):'-'}</span></div><div class="gProc">${esc(activeProcessFromUnit(u)||'-')}</div></div><div class="gTimeline">`;
     for(let d=1;d<=days;d++){const date=new Date(y,m,d);html+=`<i class="gLine ${dayKey(date)===dayKey(today)?'todayLine':''}"></i>`;}
     const ms=new Date(y,m,1,0,0,0,0),me=new Date(y,m+1,1,0,0,0,0),span=me-ms;
     html+=`<div class="gLane plan"><em class="laneLabel">PLAN</em>`;
     (u.jobs||[]).forEach(j=>{
       const st=parseDate(j.start),en=parseDate(j.end);if(!st||!en||en<=ms||st>=me)return;
       const vs=st<ms?ms:st,ve=en>me?me:en,left=(vs-ms)/span*100,width=(ve-vs)/span*100;
       html+=`<button class="gBar ${monthPlanClass(j.process)}" style="left:${left}%;width:${Math.max(.7,width)}%" onclick="openJscbPopup('${esc(u.nopol||'')}')" title="${esc(j.process)} | ${dt(j.start)} → ${dt(j.end)}"><span>${esc(j.process)}</span></button>`;
     });
     html+=`</div><div class="gLane act"><em class="laneLabel">ACT</em>`;
     if(actual?.start&&actual.start<me){
       const st=actual.start<ms?ms:actual.start,ve=new Date(),left=(st-ms)/span*100,width=Math.max(.7,(ve-st)/span*100);
       html+=`<button class="gBar actualBar" style="left:${left}%;width:${width}%" onclick="openJscbPopup('${esc(u.nopol||'')}')" title="ACTUAL ${esc(actual.process)}"><span>${esc(actual.process)}</span></button>`;
     }
     html+=`</div></div></div>`;
   });
 };
 const renderGroup=(name,arr)=>{
   if(!arr.length)return;
   html+=`<div class="gGroup"><b>${name}</b><span>${arr.length} UNIT</span></div>`;
   ['LIGHT','MEDIUM','HEAVY'].forEach(cat=>{
     const catArr=arr.filter(u=>modeOf(u)===cat);
     renderCategory(name,cat,catArr);
   });
   const unknown=arr.filter(u=>!['LIGHT','MEDIUM','HEAVY'].includes(modeOf(u)));
   if(unknown.length)renderCategory(name,'BELUM ADA KATEGORI',unknown);
 };
 renderGroup('ATU 1',groups['ATU 1']);renderGroup('ATU 2',groups['ATU 2']);renderGroup('LAINNYA',groups.LAINNYA);
 html+=`</div>`;root.innerHTML=html;root.dataset.hasRendered='1';
}



load();
setInterval(load,60000);
</script>
