   const incomplete=jobs.length<PROC.length-Math.max(0,PROC.findIndex(p=>p[0]===nu._cur));

   const rec=atRisk
     ?'🔴 TIDAK FEASIBLE — TIDAK ADA SLOT CUKUP SEBELUM JANJI SELESAI'

       ?'🟠 TIGHT — slack ≤ 4 jam'
       :'🟢 REKOMENDASI SISTEM';

     currentProcess:nu._cur,

function jsonpDirect(action, ok, fail, timeoutMs=10000, forceRefresh=false){
 const cb='JSCB_API_'+String(action).replace(/[^A-Za-z0-9_$]/g,'_')+'_'+Date.now();
 let done=false;
 const script=document.createElement('script');
 script.async=true;
 script.id=cb;
 const cleanup=()=>{try{delete window[cb]}catch(e){};if(script.parentNode)script.parentNode.removeChild(script)};
 const good=(res)=>{if(done)return;done=true;clearTimeout(timer);cleanup();try{ok(res)}catch(e){console.error('API callback error',e);if(fail)fail('ERROR CALLBACK: '+(e.message||e))}};
 const bad=(msg)=>{if(done)return;done=true;clearTimeout(timer);cleanup();if(fail)fail(msg)};
 window[cb]=good;
 script.onerror=()=>bad('SCRIPT API GAGAL DIMUAT. Cek URL Web App / deployment / akses Anyone.');
 const base=String(API||'').replace(/\?$/,'');
 script.src=base+'?action='+encodeURIComponent(action)+'&callback='+encodeURIComponent(cb)+'&refresh='+(forceRefresh?'1':'0')+'&_='+Date.now();
 document.head.appendChild(script);
 const timer=setTimeout(()=>bad('TIMEOUT '+Math.round(timeoutMs/1000)+' DETIK — API tidak mengirim callback.'),timeoutMs);
}

function cacheData(){

   if(!DATA||!Array.isArray(DATA.raw)||!DATA.raw.length)return false;

     version:10,
     savedAt:new Date().toISOString(),
     data:{success:true,totalUnits:DATA.totalUnits||DATA.raw.length,plan:DATA.plan||[],raw:DATA.raw}

function restoreCache(){
 try{
   let raw=null,sourceKey='';
   for(const k of CACHE_KEYS){
     try{const v=localStorage.getItem(k);if(v){raw=v;sourceKey=k;break}}catch(_){ }
   }
   if(!raw)return false;
   const payload=JSON.parse(raw);
   if(!payload||!payload.data||!Array.isArray(payload.data.raw)||!payload.data.raw.length)return false;
   const rows=payload.data.raw.map(u=>Object.assign({},u)).map(normalizeApiDates);

   // Jika plan cache rusak/tidak tersedia, hitung ulang sebagai fallback.
   let plan=Array.isArray(payload.data.plan)&&payload.data.plan.length?payload.data.plan:makePlan(rows);
   applySavedDecisions(plan);
   DATA={success:true,totalUnits:rows.length,plan,actual:rows,raw:rows};
   cacheSavedAt=payload.savedAt||null;
   renderMonthPlan();
   console.log('[JSCB] CACHE RESTORED:',rows.length,'unit',cacheSavedAt||'', 'from', sourceKey||CACHE_KEY);
   if(sourceKey!==CACHE_KEY){try{localStorage.setItem(CACHE_KEY,JSON.stringify(payload))}catch(_){ }}
   return true;
 }catch(e){
   console.warn('[JSCB] CACHE RESTORE GAGAL:',e);
   try{localStorage.removeItem(CACHE_KEY)}catch(_){ }
   return false;
 }
}

function monthPlanDisplaySegments(u, ms, me){

 const due=parseDate(janjiSelesaiOf(u));

 // Unit terlambat: visual PLAN dimulai dari proses aktual yang sedang berjalan,
 // bukan membuat WAITING STALL raksasa dari PKB KE GROUP sampai hari ini.
 let cursor=overdue ? (jobs[0]?parseDate(jobs[0].start):null) : planAnchorOf(u);
 // Scheduled jobs: every gap is explicitly rendered as WAITING STALL so the PLAN never looks disconnected.
 for(const j of jobs){
   const st=parseDate(j.start), en=parseDate(j.end); if(!st||!en)continue;

   cursor=en;
 }

 // Untuk unit yang belum terlambat, PLAN tunduk pada JANJI SELESAI dan tidak diperpanjang keluar deadline.
 return seg;
}

function syncGroupScrollers(){

   if(!info||!timeline||block.dataset.syncBound==='1')return;
   block.dataset.syncBound='1';
   let locking=false;
   const sync=(src,dst)=>{
     if(locking)return;
     locking=true;
     dst.scrollTop=src.scrollTop;
     requestAnimationFrame(()=>{locking=false;});
   };
   info.addEventListener('scroll',()=>sync(info,timeline),{passive:true});
   timeline.addEventListener('scroll',()=>sync(timeline,info),{passive:true});
   const pause=()=>{
     block.dataset.pauseUntil=String(Date.now()+7000);
     info.classList.add('isUserScrolling');
     timeline.classList.add('isUserScrolling');
   };
   ['wheel','touchstart','pointerdown'].forEach(ev=>{
     info.addEventListener(ev,pause,{passive:true});
     timeline.addEventListener(ev,pause,{passive:true});
   });
 });

     if(next>=max){
       block.datasetdirection='up';
       block.dataset.pauseUntil=String(Date.now()+2000);
     }
   });
 },2000);
}
